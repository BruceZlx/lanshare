<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LanShare · 局域网互传</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f8cff'/%3E%3Cpath d='M14 24h26l-7-7 5-5 16 16-16 16-5-5 7-7H14z' fill='%23fff'/%3E%3Cpath d='M50 44H24l7 7-5 5-16-16' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="url(#g)"/><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4f8cff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><path d="M14 24h26l-7-7 5-5 16 16-16 16-5-5 7-7H14z" fill="#fff"/><path d="M50 44H24l7 7-5 5-16-16 16-16 5 5-7 7h26z" fill="#fff" opacity=".55"/></svg>
    <div>
      <h1>LanShare</h1>
      <span class="sub" data-i18n="tagline">局域网内 P2P 互传文件</span>
    </div>
  </div>
  <div class="head-right">
    <span id="self-chip" class="chip"></span>
    <select id="lang" title="Language">
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
    <button id="btn-settings" class="btn ghost">⚙ <span data-i18n="settings">设置</span></button>
  </div>
</header>

<main>
  <section class="grid-top">
    <div class="card" id="peers-card">
      <h2 data-i18n="devices">附近设备</h2>
      <div id="peers" class="peer-list"><div class="empty" data-i18n="searching">正在搜索局域网设备…</div></div>
      <div class="manual">
        <div class="manual-hint" data-i18n="manualHint">搜索不到设备（如路由器开启了 AP 隔离）？输入对方 IP:端口 手动连接：</div>
        <div class="manual-row">
          <input id="manual-addr" placeholder="192.168.1.5:8612" spellcheck="false">
          <button id="btn-add-peer" class="btn ghost" data-i18n="connect">连接</button>
        </div>
      </div>
    </div>

    <div class="card" id="send-card">
      <h2 data-i18n="send">发送文件</h2>
      <div id="dropzone" tabindex="0">
        <svg viewBox="0 0 24 24" class="dz-icon"><path d="M12 3l4.5 4.5-1.4 1.4L13 6.8V15h-2V6.8L8.9 8.9 7.5 7.5 12 3zm-7 16v-2h14v2H5z" fill="currentColor"/></svg>
        <div class="dz-hint" data-i18n="dropHint">把文件或文件夹拖到这里</div>
        <div class="dz-actions">
          <button id="btn-files" class="btn" data-i18n="chooseFiles">选择文件</button>
          <button id="btn-folder" class="btn ghost" data-i18n="chooseFolder">选择文件夹</button>
        </div>
        <input type="file" id="file-input" multiple hidden>
        <input type="file" id="folder-input" webkitdirectory multiple hidden>
      </div>
      <div id="file-list"></div>
      <div id="send-bar">
        <div id="send-progress" class="hidden">
          <div class="progress"><div class="bar" id="send-bar-fill"></div></div>
          <div class="progress-meta"><span id="send-progress-text"></span><button id="btn-cancel" class="btn tiny ghost" data-i18n="cancel">取消</button></div>
        </div>
        <button id="btn-send" class="btn primary" disabled data-i18n="sendToNone">请先选择目标设备</button>
      </div>
    </div>
  </section>

  <section class="card hidden" id="incoming-card">
    <h2 data-i18n="incoming">传输</h2>
    <div id="offers"></div>
  </section>

  <section class="card">
    <h2 data-i18n="history">传输历史</h2>
    <div id="history"><div class="empty" data-i18n="noHistory">暂无传输记录</div></div>
  </section>
</main>

<dialog id="settings-dialog">
  <h2 data-i18n="settings">设置</h2>
  <label><span data-i18n="deviceName">设备名称</span><input id="set-name" spellcheck="false"></label>
  <label><span data-i18n="downloadDir">保存目录</span><input id="set-dir" spellcheck="false"></label>
  <label class="check"><input type="checkbox" id="set-auto"><span data-i18n="autoAccept">自动接收（不询问，直接保存）</span></label>
  <div class="self-addr">
    <div class="manual-hint" data-i18n="selfAddrHint">在其他设备上访问以下地址，可手动连接本机：</div>
    <code id="self-addr"></code>
  </div>
  <div class="dialog-actions">
    <button id="btn-set-cancel" class="btn ghost" data-i18n="cancel">取消</button>
    <button id="btn-set-save" class="btn primary" data-i18n="save">保存</button>
  </div>
</dialog>

<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
